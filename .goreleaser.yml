project_name: terraform-provider-multipass
version: 2

before:
  hooks:
    - python3 scripts/package-host-tools.py build/release/host-tools.tar.gz

builds:
  - id: provider
    env: [CGO_ENABLED=0]
    main: ./cmd/terraform-provider-multipass
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags: ['-s -w -X main.version={{.Version}}']
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    binary: '{{ .ProjectName }}_v{{ .Version }}'
  - id: doctor
    env: [CGO_ENABLED=0]
    main: ./cmd/multipass-doctor
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags: [-trimpath]
    ldflags: ['-s -w']
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    binary: multipass-doctor

archives:
  - formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE]

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
    - glob: build/release/host-tools.tar.gz
      name_template: '{{ .ProjectName }}_{{ .Version }}_host-tools.tar.gz'
    - glob: packaging/public-key.asc
      name_template: nanofaas-multipass-signing-key.asc
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args: [--batch, --local-user, '{{ .Env.GPG_FINGERPRINT }}', --output, '${signature}', --detach-sign, '${artifact}']

release:
  draft: true
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
    - glob: build/release/host-tools.tar.gz
      name_template: '{{ .ProjectName }}_{{ .Version }}_host-tools.tar.gz'
    - glob: packaging/public-key.asc
      name_template: nanofaas-multipass-signing-key.asc

changelog:
  disable: true
