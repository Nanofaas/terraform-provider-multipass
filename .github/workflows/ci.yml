name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'

jobs:
  test:
    name: Go test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        go-version: [ '1.25.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go test
        run: go test ./...


      - name: Static analysis
        run: go vet ./...

      - name: Race checks
        if: runner.os == 'Linux'
        run: go test -race ./internal/...

      - uses: opentofu/setup-opentofu@v2
        if: runner.os == 'Linux'
        with:
          tofu_version: '1.13.2'
          tofu_wrapper: false

      - name: Validate OpenTofu examples and schema
        if: runner.os == 'Linux'
        run: bash scripts/validate-opentofu.sh
