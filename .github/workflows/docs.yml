name: Documentation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # tfplugindocs 0.25.0 requires Go 1.25.8 or newer.
          go-version: '1.25.x'
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.13.2'
          tofu_wrapper: false
      - name: Validate Registry documentation and local links
        shell: pwsh
        run: ./scripts/validate-docs.ps1 -TerraformPath tofu
