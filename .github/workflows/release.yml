name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build and validate artifacts without publishing or signing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source and packaging
        run: |
          go test ./...
          go vet ./...
          python3 -m unittest discover -s scripts -p 'test_*.py'
          if [ '${{ inputs.snapshot }}' != true ] && [ '${{ github.ref_type }}' != tag ]; then
            echo 'Publishing requires a release tag.' >&2
            exit 1
          fi
      - name: Import GPG key
        if: ${{ !inputs.snapshot }}
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Build release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.19.0
          args: ${{ inputs.snapshot && 'release --snapshot --clean --skip=publish,sign' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Validate artifacts
        run: python3 scripts/verify-release.py dist --stage
      - name: Verify signature and publish validated draft
        if: ${{ !inputs.snapshot }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gpg --verify dist/*_SHA256SUMS.sig dist/*_SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Preserve snapshot artifacts
        if: ${{ inputs.snapshot }}
        uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*_manifest.json
            dist/*_SHA256SUMS
            dist/*.asc
